<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frame · 本地裁剪</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#172033;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button,select{cursor:pointer}button{border:1px solid #dbe1e8;border-radius:9px;padding:10px 16px;background:white;color:inherit}button:hover{background:#f1f5f9}button:disabled{opacity:.45;cursor:default}:focus-visible{outline:3px solid #93c5fd;outline-offset:3px}header{height:80px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e2e8f0;padding:0 5%}.logo{font-size:23px;font-weight:750}.logo span{color:#2563eb}small,.muted{color:#64748b}main{max-width:1320px;margin:36px auto;padding:0 24px}h1{font-size:30px;margin:0 0 10px;text-wrap:balance}p{line-height:1.7;text-wrap:pretty}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:24px;margin-top:28px}.panel{background:white;border:1px solid #e2e8f0;border-radius:16px;overflow:hidden}.toolbar{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #e2e8f0;gap:12px}.stage{height:480px;display:flex;align-items:center;justify-content:center;background:#111827;padding:24px;position:relative}.empty{text-align:center;color:#cbd5e1}.empty strong{display:block;font-size:21px;color:white;margin-bottom:12px}.primary{background:#2563eb;color:white;border-color:#2563eb}.primary:hover{background:#1d4ed8}.media-wrap{position:relative;isolation:isolate;max-width:100%;max-height:100%;line-height:0;touch-action:none}.media-wrap:after{content:"";position:absolute;inset:0;border:2px solid #60a5fa;outline:1px solid #0f172a;pointer-events:none;z-index:20}.media-wrap{box-shadow:0 0 0 1px #0f172a}#media img,#media video{display:block;max-width:100%;max-height:430px;object-fit:contain;user-select:none}#selection{position:absolute;border:2px solid white;box-shadow:0 0 0 9999px #0004;cursor:move;pointer-events:auto}#selection:before,#selection:after{content:'';position:absolute;inset:33.33% 0;border-top:1px solid #ffffff60;border-bottom:1px solid #ffffff60}#selection:after{inset:0 33.33%;border:0;border-left:1px solid #ffffff60;border-right:1px solid #ffffff60}#selection:before,#selection:after{pointer-events:none}.handle{position:absolute;width:24px;height:24px;z-index:10;touch-action:none}.handle:after{content:'';position:absolute;inset:7px;background:white;border:1px solid #2563eb;border-radius:2px}.handle[data-dir=n]{left:50%;top:0;transform:translate(-50%,-50%);cursor:ns-resize}.handle[data-dir=s]{left:50%;top:100%;transform:translate(-50%,-50%);cursor:ns-resize}.handle[data-dir=w]{left:0;top:50%;transform:translate(-50%,-50%);cursor:ew-resize}.handle[data-dir=e]{left:100%;top:50%;transform:translate(-50%,-50%);cursor:ew-resize}.handle[data-dir=nw]{left:0;top:0;transform:translate(-50%,-50%);cursor:nwse-resize}.handle[data-dir=ne]{left:100%;top:0;transform:translate(-50%,-50%);cursor:nesw-resize}.handle[data-dir=sw]{left:0;top:100%;transform:translate(-50%,-50%);cursor:nesw-resize}.handle[data-dir=se]{left:100%;top:100%;transform:translate(-50%,-50%);cursor:nwse-resize}.clip-area{overflow:hidden}.side{padding:24px}.side h2{font-size:17px;margin:0 0 24px}.field{margin:18px 0}label{display:block;font-size:13px;color:#475569;margin-bottom:8px}input,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;background:white;color:#172033}input[type=range]{padding:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.side .primary{width:100%;margin-top:20px}.note{font-size:12px;color:#64748b;line-height:1.7}.time{padding:20px;border-top:1px solid #e2e8f0}.timebar{display:flex;align-items:center;gap:12px}#seek{flex:1}#status{font-size:13px;line-height:1.7;min-height:24px;margin-top:14px;color:#475569}#status.error{color:#dc2626}#name{max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.badge{background:#eff6ff;color:#2563eb;border-radius:20px;padding:7px 12px;font-size:12px}footer{margin:24px 0;color:#64748b;font-size:12px}a{color:#2563eb}input{font-variant-numeric:tabular-nums}[hidden]{display:none!important}@media(max-width:850px){.workspace{grid-template-columns:1fr}.stage{height:360px}#media img,#media video{max-height:310px}header{padding:0 24px}.badge{display:none}}
</style>
<header><div class="logo"><span>▣</span> Frame <small style="font-size:13px;font-weight:400;margin-left:12px">本地裁剪工作台</small></div><span class="badge">● 素材仅在本机处理</span></header>
<main><h1>留下你想要的画面。</h1><p class="muted">裁剪图片、调整视频画幅，或截取一段精彩片段。</p><input id="file" type="file" accept="image/*,video/*" hidden>
<div class="workspace"><section class="panel"><div class="toolbar"><span id="name">尚未选择素材</span><button id="choose">＋ 选择文件</button></div><div class="stage clip-area" id="drop"><div class="empty" id="empty"><strong>把图片或视频拖到这里</strong><p>也可以点击右上角选择文件<br><small>支持浏览器可预览的图片和视频</small></p></div><div class="media-wrap" id="wrap" hidden><div id="media"></div><div id="selection"><span class="handle" data-dir="n" aria-hidden="true"></span><span class="handle" data-dir="s" aria-hidden="true"></span><span class="handle" data-dir="w" aria-hidden="true"></span><span class="handle" data-dir="e" aria-hidden="true"></span><span class="handle" data-dir="nw" aria-hidden="true"></span><span class="handle" data-dir="ne" aria-hidden="true"></span><span class="handle" data-dir="sw" aria-hidden="true"></span><span class="handle" data-dir="se" aria-hidden="true"></span></div></div></div><div class="time" id="timeline" hidden><div class="timebar"><button id="play" aria-label="播放或暂停">播放</button><input id="seek" aria-label="视频播放位置" type="range" min="0" step="0.01" value="0"><small id="clock">0.00 秒</small></div></div></section>
<aside class="panel side"><h2>裁剪设置</h2><div class="field"><label for="ratio">画面比例</label><select id="ratio"><option value="0">自由裁剪</option><option value="1">1:1 · 正方形</option><option value="1.7777777778">16:9 · 横屏</option><option value="0.5625">9:16 · 竖屏</option><option value="1.3333333333">4:3 · 经典</option><option value="0.75">3:4 · 竖图</option></select></div><p class="note">蓝色外框是素材原始边界，白色框是裁剪范围。拖动四边或四角微调，拖动框内移动选区；在框外拖动可重新框选。也可输入精确像素。</p><div class="grid"><div><label for="x">左侧 X</label><input id="x" type="number" min="0" value="0"></div><div><label for="y">顶部 Y</label><input id="y" type="number" min="0" value="0"></div><div><label for="w">宽度</label><input id="w" type="number" min="1" value="0"></div><div><label for="h">高度</label><input id="h" type="number" min="1" value="0"></div></div><div id="trim" hidden><div class="field grid"><div><label for="start">起点（秒）</label><input id="start" type="number" min="0" step="0.01" value="0"></div><div><label for="end">终点（秒）</label><input id="end" type="number" min="0" step="0.01"></div></div><p class="note">视频导出为 MP4（H.264），保留原音频。</p></div><div class="field" id="formatField"><label for="format">图片导出格式</label><select id="format"><option value="image/png">PNG · 保留透明背景</option><option value="image/jpeg">JPG · 高质量</option><option value="image/webp">WebP</option></select></div><button id="reset" style="width:100%;margin-top:20px" disabled>重置裁剪</button><button id="export" class="primary" disabled>导出裁剪文件 ↓</button><p id="cacheStatus" class="note" role="status"></p><div id="exportProgress" hidden style="margin-top:18px"><label id="progressLabel" for="progressBar">准备导出</label><progress id="progressBar" max="100" value="0" style="width:100%;height:12px;accent-color:#2563eb"></progress></div><div id="status" role="status" aria-live="polite"></div></aside></div><footer>离线可用 · 视频由本地 FFmpeg 处理 · 导出期间请保持页面打开</footer></main>
<script>
const $=id=>document.getElementById(id);let file,el,url,W=0,H=0,video=false,busy=false,crop={x:0,y:0,w:0,h:0};
let cacheDB,cacheTimer,activeCacheId,loadVersion=0;
function openCache(){return new Promise((resolve,reject)=>{let req=indexedDB.open('frame-local-cache',1);req.onupgradeneeded=()=>req.result.createObjectStore('last');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function cacheTransaction(mode,action){return new Promise((resolve,reject)=>{let tx=cacheDB.transaction('last',mode);action(tx.objectStore('last'));tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}
function cacheWarning(){$('cacheStatus').textContent='浏览器未能保存缓存（可能空间不足），当前素材仍可正常裁剪导出。'}
async function cacheFile(f,id){try{cacheDB=await cacheReady;if(!cacheDB)return;await cacheTransaction('readwrite',store=>store.put({file:f,id},'file'));if(id===activeCacheId){$('cacheStatus').textContent='已在此浏览器缓存上一次素材，下次打开自动恢复。';saveSettings()}}catch(e){cacheWarning()}}
function scheduleSave(){clearTimeout(cacheTimer);if(file)saveSettings()}
function saveSettings(){if(!file||!activeCacheId)return;let value={id:activeCacheId,crop:{...crop},ratio:$('ratio').value,start:$('start').value,end:$('end').value,time:video?el.currentTime:0,format:$('format').value};try{localStorage.setItem('frame-last-settings',JSON.stringify(value))}catch(e){}if(cacheDB){cacheTransaction('readwrite',store=>store.put(value,'settings')).catch(cacheWarning)}else{cacheReady.then(db=>{if(db)return cacheTransaction('readwrite',store=>store.put(value,'settings'))}).catch(cacheWarning)}}
const cacheReady=openCache().catch(()=>{cacheWarning();return null});
async function restoreCache(){let version=loadVersion;try{cacheDB=await cacheReady;if(!cacheDB)return;let asset,settings;await cacheTransaction('readonly',store=>{store.get('file').onsuccess=e=>asset=e.target.result;store.get('settings').onsuccess=e=>settings=e.target.result});try{settings=JSON.parse(localStorage.getItem('frame-last-settings'))||settings}catch(e){}if(asset&&version===loadVersion){load(asset.file,settings?.id===asset.id?settings:{id:asset.id});$('cacheStatus').textContent='已从此浏览器的本地缓存恢复素材。'}}catch(e){cacheWarning()}}
for(const id of ['start','end','format'])$(id).addEventListener('change',scheduleSave);
window.addEventListener('pagehide',saveSettings);
function progress(value,label){$('exportProgress').hidden=false;$('progressLabel').textContent=label+(value===null?'':' · '+Math.round(value)+'%');if(value===null)$('progressBar').removeAttribute('value');else $('progressBar').value=value}
function uploadVideo(opts){return new Promise((resolve,reject)=>{let xhr=new XMLHttpRequest();xhr.open('POST','/export');xhr.setRequestHeader('X-Crop',JSON.stringify(opts));xhr.upload.onprogress=e=>{if(e.lengthComputable)progress(e.loaded/e.total*100,'正在提交到本机')};xhr.upload.onload=()=>{progress(0,'正在编码 MP4');status('正在编码 MP4，请保持页面打开。')};xhr.onerror=()=>reject(Error('无法连接本地服务，请检查服务是否运行。'));xhr.onload=()=>{try{let data=JSON.parse(xhr.responseText);if(xhr.status<200||xhr.status>=300)throw Error(data.error||'提交失败');resolve(data)}catch(e){reject(e)}};xhr.send(file)})}
function status(t,error=false){$('status').textContent=t;$('status').className=error?'error':''}
function draw(){scheduleSave();if(!W)return;for(const k of ['x','y','w','h'])$(k).value=crop[k];Object.assign($('selection').style,{left:crop.x/W*100+'%',top:crop.y/H*100+'%',width:crop.w/W*100+'%',height:crop.h/H*100+'%'});}
function reset(){crop={x:0,y:0,w:W,h:H};$('ratio').value='0';draw()}
$('choose').onclick=()=>$('file').click();$('file').onchange=e=>load(e.target.files[0]);$('drop').ondragover=e=>e.preventDefault();$('drop').ondrop=e=>{e.preventDefault();load(e.dataTransfer.files[0])};
function load(f,saved=null){if(busy||!f)return;if(!/^(image|video)\//.test(f.type)){status('请选择图片或视频文件。',true);return}loadVersion++;activeCacheId=saved?.id||crypto.randomUUID();if(el&&video)el.pause();if(url)URL.revokeObjectURL(url);$('exportProgress').hidden=true;file=f;video=f.type.startsWith('video/');el=document.createElement(video?'video':'img');el.draggable=false;if(video){el.playsInline=true;el.preload='metadata'}$('media').replaceChildren(el);$('wrap').hidden=true;$('empty').hidden=false;$('export').disabled=true;$('reset').disabled=true;status('正在读取素材…');url=URL.createObjectURL(f);el.onerror=()=>status('浏览器无法读取此格式，请转换为常见图片或 MP4 后重试。',true);el[video?'onloadedmetadata':'onload']=()=>{W=video?el.videoWidth:el.naturalWidth;H=video?el.videoHeight:el.naturalHeight;if(!W||!H||(video&&!Number.isFinite(el.duration))){status('无法读取素材尺寸或时长。',true);return}$('empty').hidden=true;$('wrap').hidden=false;$('name').textContent=f.name+' · '+W+' × '+H;$('timeline').hidden=$('trim').hidden=!video;$('formatField').hidden=video;$('export').disabled=$('reset').disabled=false;if(video){$('end').value=el.duration.toFixed(3);$('start').value=0;$('seek').max=el.duration;el.ontimeupdate=()=>{scheduleSave();$('seek').value=el.currentTime;$('clock').textContent=el.currentTime.toFixed(2)+' 秒'};el.onended=()=>$('play').textContent='播放'}reset();if(saved){let c=saved.crop;if(c&&Number.isInteger(c.x)&&Number.isInteger(c.y)&&Number.isInteger(c.w)&&Number.isInteger(c.h)&&c.x>=0&&c.y>=0&&c.w>0&&c.h>0&&c.x+c.w<=W&&c.y+c.h<=H)crop=c;$('ratio').value=saved.ratio||'0';if(video){$('start').value=clamp(Number(saved.start)||0,0,el.duration);$('end').value=clamp(Number(saved.end)||el.duration,+$('start').value,el.duration);el.currentTime=clamp(Number(saved.time)||0,0,el.duration)}if(saved.format)$('format').value=saved.format;draw()}if(!saved)cacheFile(f,activeCacheId);status(saved?'已恢复上一次素材与裁剪设置。':'素材已就绪，拖动边角调整裁剪范围，拖动框内可移动。')};el.src=url}
$('reset').onclick=reset;$('ratio').onchange=()=>{if(!W)return;let r=+$('ratio').value;if(r){let w=W,h=Math.round(w/r);if(h>H){h=H;w=Math.round(h*r)}crop={x:Math.floor((W-w)/2),y:Math.floor((H-h)/2),w,h};draw()}};
for(const k of ['x','y','w','h'])$(k).onchange=()=>{if(!W)return;let v=Math.round(+$(k).value);crop[k]=Number.isFinite(v)?v:0;crop.x=Math.max(0,Math.min(W-1,crop.x));crop.y=Math.max(0,Math.min(H-1,crop.y));crop.w=Math.max(1,Math.min(W-crop.x,crop.w));crop.h=Math.max(1,Math.min(H-crop.y,crop.h));$('ratio').value='0';draw()};
for(const k of ['x','y','w','h'])$(k).oninput=$(k).onchange;
let drag;
const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
function point(e){let r=$('wrap').getBoundingClientRect();return{x:clamp(Math.round((e.clientX-r.left)/r.width*W),0,W),y:clamp(Math.round((e.clientY-r.top)/r.height*H),0,H)}}
function resizeCrop(c,d,p,r,W,H){
 let left=c.x,right=c.x+c.w,top=c.y,bottom=c.y+c.h;
 if(d.includes('w'))left=clamp(p.x,0,right-1);
 if(d.includes('e'))right=clamp(p.x,left+1,W);
 if(d.includes('n'))top=clamp(p.y,0,bottom-1);
 if(d.includes('s'))bottom=clamp(p.y,top+1,H);
 if(r){
  const horizontal=/[we]/.test(d),vertical=/[ns]/.test(d);
  if(horizontal&&vertical){
   let ax=d.includes('w')?c.x+c.w:c.x,ay=d.includes('n')?c.y+c.h:c.y;
   let width=Math.max(right-left,(bottom-top)*r);
   width=Math.min(width,d.includes('w')?ax:W-ax,(d.includes('n')?ay:H-ay)*r);
   let height=width/r;left=d.includes('w')?ax-width:ax;right=left+width;top=d.includes('n')?ay-height:ay;bottom=top+height;
  }else if(horizontal){
   let cy=c.y+c.h/2,width=Math.min(right-left,2*Math.min(cy,H-cy)*r),height=width/r;
   if(d==='w')left=right-width;else right=left+width;top=cy-height/2;bottom=cy+height/2;
  }else{
   let cx=c.x+c.w/2,height=Math.min(bottom-top,2*Math.min(cx,W-cx)/r),width=height*r;
   if(d==='n')top=bottom-height;else bottom=top+height;left=cx-width/2;right=cx+width/2;
  }
 }
 let x=clamp(Math.round(left),0,W-1),y=clamp(Math.round(top),0,H-1);
 return{x,y,w:clamp(Math.round(right)-x,1,W-x),h:clamp(Math.round(bottom)-y,1,H-y)};
}
$('wrap').onpointerdown=e=>{if(busy||!W||e.button!==0)return;e.preventDefault();let dir=e.target.closest('[data-dir]')?.dataset.dir;drag={mode:dir?'resize':e.target.closest('#selection')?'move':'new',dir,start:point(e),crop:{...crop}};$('wrap').setPointerCapture(e.pointerId)};
$('wrap').onpointermove=e=>{if(!drag)return;let p=point(e),c=drag.crop,r=+$('ratio').value;
 if(drag.mode==='move'){crop={...c,x:clamp(c.x+p.x-drag.start.x,0,W-c.w),y:clamp(c.y+p.y-drag.start.y,0,H-c.h)}}
 else if(drag.mode==='resize'){crop=resizeCrop(c,drag.dir,p,r,W,H)}
 else{let a=drag.start,w=Math.abs(p.x-a.x),h=Math.abs(p.y-a.y);if(r){h=w/r;let maxH=p.y<a.y?a.y:H-a.y;if(h>maxH){h=maxH;w=h*r}}let x=Math.round(p.x<a.x?a.x-w:a.x),y=Math.round(p.y<a.y?a.y-h:a.y);x=clamp(x,0,W-1);y=clamp(y,0,H-1);crop={x,y,w:clamp(Math.round(w),1,W-x),h:clamp(Math.round(h),1,H-y)}}draw();
};
$('wrap').onpointerup=$('wrap').onpointercancel=$('wrap').onlostpointercapture=()=>drag=null;
$('play').onclick=()=>{if(el.paused){el.play();$('play').textContent='暂停'}else{el.pause();$('play').textContent='播放'}};$('seek').oninput=()=>el.currentTime=+$('seek').value;
function download(blob,ext){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=file.name.replace(/\.[^.]+$/,'')+'-裁剪.'+ext;a.click();setTimeout(()=>URL.revokeObjectURL(u),10000)}
$('export').onclick=async()=>{if(!file||busy)return;try{if(video){let start=+$('start').value,end=+$('end').value;if(!Number.isFinite(start)||!Number.isFinite(end)||start<0||end>el.duration+.01||end<=start)throw Error('请设置有效起止时间，终点须大于起点且不超过视频时长。');if(crop.w<2||crop.h<2)throw Error('视频裁剪宽高至少为 2 像素。');busy=true;$('export').disabled=$('choose').disabled=$('reset').disabled=true;el.pause();progress(0,'正在提交到本机');status('正在提交本地视频…');let data=await uploadVideo({...crop,start,end});for(;;){await new Promise(r=>setTimeout(r,800));let j=await(await fetch('/job/'+data.id)).json();if(j.error)throw Error(j.error);progress(j.progress??null,j.progress>=99&&j.state!=='done'?'正在封装 MP4':'正在编码 MP4');if(j.state==='done'){progress(100,'导出完成');let a=document.createElement('a');a.href=j.url;a.download='cropped.mp4';a.textContent='下载 MP4';$('status').replaceChildren('导出完成。',a);a.click();break}}}else{progress(null,'正在生成图片');await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));let canvas=document.createElement('canvas');canvas.width=crop.w;canvas.height=crop.h;let ctx=canvas.getContext('2d');if($('format').value==='image/jpeg'){ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height)}ctx.drawImage(el,crop.x,crop.y,crop.w,crop.h,0,0,crop.w,crop.h);let type=$('format').value;let blob=await new Promise(resolve=>canvas.toBlob(resolve,type,.95));if(!blob)throw Error('图片导出失败');download(blob,blob.type.split('/')[1].replace('jpeg','jpg'));progress(100,'导出完成');status('图片导出完成，已开始下载。')}}catch(e){$('exportProgress').hidden=true;status(e.message,true)}finally{busy=false;$('export').disabled=$('choose').disabled=$('reset').disabled=false}};
restoreCache();
</script></html>
