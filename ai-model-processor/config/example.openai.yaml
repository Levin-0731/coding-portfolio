provider: openai
model: gpt-4.1-mini
task_type: text_to_text

api:
  api_key_env: OPENAI_API_KEY
  base_url: https://api.openai.com/v1
  timeout: 120

input:
  path: examples/sample_input.csv
  format: csv
  id_column: id
  fields:
    text: text

output:
  path: outputs/openai_output.csv
  result_column: result
  error_column: error

prompt:
  template: "请把下面的文本改写得更简洁：{text}"

options:
  openai:
    temperature: 0.2
