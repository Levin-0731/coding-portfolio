task_type: text_to_text

models:
  - provider: mock
    model: alpha
    options:
      mock_prefix: A
  - provider: mock
    model: beta
    options:
      mock_prefix: B

input:
  path: examples/sample_input.csv
  format: csv
  id_column: id
  fields:
    text: text

output:
  path: outputs/compare.csv

prompt:
  template: "请把下面的文本改写得更简洁：{text}"
