[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-model-processor"
version = "0.1.0"
description = "Configurable local batch processor for AI model APIs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openpyxl>=3.1.2",
  "PyYAML>=6.0.1",
  "requests>=2.31.0",
  "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
ai-model-processor = "ai_model_processor.cli:main"

[tool.setuptools.packages.find]
include = ["ai_model_processor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
