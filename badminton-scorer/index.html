<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>羽毛球计分</title>
  <style>
    :root {
      --bg: #f6f5f2;
      --ink: #1c1917;
      --muted: #78716c;
      --line: #e7e5e4;
      --panel: #fff;
      --accent: #9f2d2d;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
      line-height: 1.45;
    }
    button, input { font: inherit; color: inherit; }
    button { touch-action: manipulation; }
    h1 { text-wrap: balance; font-size: 1.75rem; font-weight: 600; margin: 0; letter-spacing: 0; }
    p { text-wrap: pretty; margin: 0; }
    .nums { font-variant-numeric: tabular-nums; }
    .wrap {
      width: min(880px, 100%);
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 20px 16px calc(16px + env(safe-area-inset-bottom));
    }
    .narrow { width: min(32rem, 100%); }
    .stack { display: flex; flex-direction: column; gap: 16px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; }
    .muted { color: var(--muted); }
    .kicker { color: var(--muted); font-size: 0.875rem; }
    .btn, .choice {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 6px;
      padding: 10px 14px;
      cursor: pointer;
    }
    .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
    .choice[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: #fff; }
    .btn:disabled, .choice:disabled { cursor: default; opacity: 0.45; }
    label { display: flex; flex-direction: column; gap: 6px; font-size: 0.875rem; color: var(--muted); }
    input[type="text"] {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 6px;
      padding: 10px 12px;
      color: var(--ink);
    }
    .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .court {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }
    .side {
      min-height: 46dvh;
      border: 1px solid var(--line);
      border-top: 3px solid transparent;
      background: var(--panel);
      border-radius: 6px;
      padding: 16px;
      text-align: left;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      cursor: pointer;
    }
    .side.is-server { border-top-color: var(--accent); }
    .side:disabled { cursor: default; }
    .players { font-size: 1rem; max-width: 100%; }
    .players span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .serve-name { font-weight: 600; }
    .score {
      font-variant-numeric: tabular-nums;
      font-size: clamp(4.5rem, 18vw, 7.5rem);
      line-height: 0.9;
      font-weight: 560;
      margin-top: auto;
    }
    .mark { color: var(--accent); font-size: 0.875rem; min-height: 1.2em; }
    .bar {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .bar .btn { flex: 1; }
    .banner {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 6px;
      padding: 14px 16px;
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .clock { font-variant-numeric: tabular-nums; font-size: 1.75rem; }
    .list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .match {
      width: 100%;
      text-align: left;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 6px;
      padding: 12px 14px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    .grow { flex: 1; }
  </style>
</head>
<body>
  <div id="app" class="wrap"></div>
  <script src="rules.js"></script>
  <script src="app.js"></script>
</body>
</html>
